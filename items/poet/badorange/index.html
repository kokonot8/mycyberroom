<main class="room-shell"><article class="single-item"><header class="single-head"><span class="date">2026-08-14</span><h1>坏橙子</h1></header><div class="single-body"><p>果篮里的坏橙子去街上走。<br>街上有许多好果，看起来颗粒饱满，<br>有正确的橙子味。<br>不要伪装了！我的坏橙子朋友们！<br>什么时候我们也能自在地行走<br>不用穿光滑的橙皮<br>不用散发新鲜水果味<br>露出腐坏的果肉<br>和流着汁的 刀子剜的创口<br>我们裸露着烂着的身子在街上走<br>烂橙子们集合！让他们看看<br>我们这些坏得各式各样的果子<br>走着走着坏成一滩脏橙的水<br>让他们看看我们便是这样过活</p></div></article></main></body></html>
