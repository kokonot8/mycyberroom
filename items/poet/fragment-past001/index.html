<main class="room-shell"><article class="single-item"><header class="single-head"><span class="date">2026-08-11</span><h1>test</h1></header><div class="single-body"><p>你说你感到一种寂寥，我低头想，<br>欢迎你来到这里，我们从来都是孤单的，<br>从来都是。可这样不是太过自大吗？<br>仿佛你我不再是亲密的旅伴，仿佛<br>我背叛了一种忠实。<br>活着，承受着，<br>这条路我走得浑身冰冷，<br>转身却看到你已经甩下我，<br>走进礁石里去。药和电囫囵下咽，<br>路…正在塌陷，你撑起<br>透明的战袍，活成一个勇士，仿佛<br>你天生就是。我竟才看出<br>那路是险象环生，苦难是后知后觉。</p></div></article></main></body></html>
