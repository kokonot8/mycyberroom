name: Build site content

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'build_content.py'
      - '.github/workflows/build-content.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build content index
        run: python build_content.py
      - name: Commit generated index if changed
        run: |
          if git diff --quiet -- data/content.json; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/content.json
          git commit -m "Update generated site content"
          git push
